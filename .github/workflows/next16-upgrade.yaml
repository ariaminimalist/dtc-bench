name: Validate Next.js 16 Upgrade

on:
  push:
    branches:
      - codex/next16-upgrade

permissions:
  contents: write

concurrency:
  group: next16-upgrade
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_benchmark
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://example.invalid
      NEXT_PUBLIC_DEFAULT_REGION: us
      NEXT_PUBLIC_BASE_URL: https://example.com
      NODE_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Resolve dependencies and lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate pnpm lockfile for Next.js 16"
            git push origin HEAD:codex/next16-upgrade
          fi

      - name: Type-check storefront
        run: pnpm --filter @dtc/storefront exec tsc --noEmit

      - name: Lint storefront
        run: pnpm --filter @dtc/storefront run lint

      - name: Build storefront
        run: pnpm --filter @dtc/storefront run build
