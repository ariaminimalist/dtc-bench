name: Bootstrap OpenNext Benchmark

on:
  push:
    branches:
      - bench/opennext

permissions:
  contents: write

concurrency:
  group: opennext-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_benchmark
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://example.invalid
      NEXT_PUBLIC_DEFAULT_REGION: us
      NEXT_PUBLIC_BASE_URL: https://example.com
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Resolve lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit pnpm lockfile generated by pnpm
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: lock OpenNext Cloudflare dependencies"
            git push origin HEAD:bench/opennext
          fi

      - name: Type-check storefront
        run: pnpm --filter @dtc/storefront exec tsc --noEmit

      - name: Build OpenNext Worker
        run: pnpm --filter @dtc/storefront run build:worker

      - name: Validate Worker bundle with Wrangler
        working-directory: apps/storefront
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/opennext-dryrun
